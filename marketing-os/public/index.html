<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MİZ Marketing OS</title>
  <meta name="description" content="My İnovatif Zeka projeleri için AI reklam ajansı — siz sadece onaylayın.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/office.css">
</head>
<body>
  <a class="sr-only" href="#main">İçeriğe atla</a>

  <!-- Giriş -->
  <div id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="panel login" novalidate>
      <h1 class="logo">MİZ <span>Marketing OS</span></h1>
      <p class="muted">Ajansınız hazır. Giriş yapın; ekip çalışsın, siz onaylayın.</p>
      <div class="field"><label for="lg-user">Kullanıcı adı</label><input id="lg-user" name="username" autocomplete="username" required></div>
      <div class="field"><label for="lg-pass">Parola</label><input id="lg-pass" name="pass" type="password" autocomplete="current-password" required></div>
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn btn-primary" type="submit">Giriş yap</button>
    </form>
  </div>

  <!-- Uygulama -->
  <div id="app-view" hidden>
    <header class="topbar">
      <h1 class="logo">MİZ <span>Marketing OS</span></h1>
      <span id="mode-badge" class="badge"></span>
      <span class="spacer"></span>
      <button id="new-brief" class="btn btn-primary" type="button">➕ Yeni brif</button>
      <button id="theme-toggle" class="btn btn-sm" type="button" aria-label="Tema değiştir">🌓</button>
      <button id="logout" class="btn btn-sm" type="button">Çıkış</button>
    </header>

    <main id="main" class="layout">
      <section class="panel office" aria-labelledby="office-title">
        <div class="office-head">
          <h2 id="office-title">🏢 Ajans ofisi</h2>
          <span id="now-working" class="now-working">Ekip boşta — yeni bir brif verin.</span>
        </div>
        <div class="wall" aria-hidden="true">
          <div class="window"></div><div class="poster">📣</div><div class="sign">MİZ AJANS</div>
          <div class="clock"><i></i></div><div class="plant">🪴</div>
        </div>
        <div class="floor"></div>
        <p id="live" class="sr-only" aria-live="polite"></p>
      </section>

      <aside class="panel" aria-label="Yönetim paneli">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="t-inbox" aria-controls="p-inbox" aria-selected="true">Onay kutusu<span id="inbox-count" class="count" hidden></span></button>
          <button class="tab" role="tab" id="t-camps" aria-controls="p-camps" aria-selected="false" tabindex="-1">Kampanyalar</button>
          <button class="tab" role="tab" id="t-projects" aria-controls="p-projects" aria-selected="false" tabindex="-1">Projeler</button>
          <button class="tab" role="tab" id="t-feed" aria-controls="p-feed" aria-selected="false" tabindex="-1">Akış</button>
        </div>
        <div class="tabpanel" role="tabpanel" id="p-inbox" aria-labelledby="t-inbox"></div>
        <div class="tabpanel" role="tabpanel" id="p-camps" aria-labelledby="t-camps" hidden></div>
        <div class="tabpanel" role="tabpanel" id="p-projects" aria-labelledby="t-projects" hidden></div>
        <div class="tabpanel" role="tabpanel" id="p-feed" aria-labelledby="t-feed" hidden><ul id="feed" class="list feed"></ul></div>
      </aside>
    </main>
  </div>

  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
